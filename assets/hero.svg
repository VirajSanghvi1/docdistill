<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <style>
      .bg { fill: #0b0f19; }
      .card { fill: #121a2a; stroke: #22304a; stroke-width: 2; }
      .muted { fill: #9aa7bd; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; font-size: 22px; }
      .title { fill: #e7eefc; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; font-size: 44px; font-weight: 700; }
      .label { fill: #cdd8ee; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; font-size: 20px; letter-spacing: 0.2px; }
      .mono { fill: #cdd8ee; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; font-size: 18px; }
      .accent { fill: #7dd3fc; }
      .accent2 { fill: #a78bfa; }
      .line { stroke: #2b3b5c; stroke-width: 3; }
      .arrow { stroke: #7dd3fc; stroke-width: 4; fill: none; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="10" refY="3" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#7dd3fc"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="630"/>

  <text class="title" x="80" y="120">Compress first. Index second.</text>
  <text class="muted" x="80" y="162">RAGLite turns verbose docs into structured Markdown, then makes them searchable.</text>

  <!-- Pipeline cards -->
  <rect class="card" x="80" y="220" width="300" height="260" rx="16"/>
  <rect class="card" x="450" y="220" width="300" height="260" rx="16"/>
  <rect class="card" x="820" y="220" width="300" height="260" rx="16"/>

  <text class="label" x="110" y="260">Raw docs</text>
  <text class="mono" x="110" y="300">- long prose</text>
  <text class="mono" x="110" y="330">- repeated boilerplate</text>
  <text class="mono" x="110" y="360">- buried details</text>
  <text class="mono" x="110" y="410" opacity="0.55">(PDF / HTML / MD / TXT)</text>

  <text class="label" x="480" y="260">Distill</text>
  <circle class="accent" cx="690" cy="250" r="6"/>
  <text class="mono" x="480" y="300"># Clean headings</text>
  <text class="mono" x="480" y="330">- bullets, checklists</text>
  <text class="mono" x="480" y="360">- normalized terms</text>
  <text class="mono" x="480" y="390">- less fluff</text>
  <text class="mono" x="480" y="430" opacity="0.55">output: structured Markdown</text>

  <text class="label" x="850" y="260">Search</text>
  <circle class="accent2" cx="1060" cy="250" r="6"/>
  <text class="mono" x="850" y="300">vector + keyword</text>
  <text class="mono" x="850" y="330">smaller context</text>
  <text class="mono" x="850" y="360">fewer duplicates</text>
  <text class="mono" x="850" y="430" opacity="0.55">Chroma collections</text>

  <!-- Arrows -->
  <line class="arrow" x1="380" y1="350" x2="450" y2="350" marker-end="url(#arrowhead)"/>
  <line class="arrow" x1="750" y1="350" x2="820" y2="350" marker-end="url(#arrowhead)"/>

  <!-- Footer -->
  <text class="muted" x="80" y="560">Local-first • Optional OpenClaw engine • Auditable Markdown outputs</text>
</svg>
