[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "raglite"
version = "1.0.0"
description = "Local-first RAG-lite CLI: condense docs into structured Markdown, then index/query with Chroma + hybrid search"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Viraj Sanghvi" }]
license = { file = "LICENSE" }
keywords = ["rag", "docs", "chroma", "ollama", "openclaw", "summarization", "local-first"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: POSIX :: Linux",
]

# Keep deps reasonably constrained but not brittle.
dependencies = [
  "beautifulsoup4>=4.12.3,<5",
  "lxml>=5.3.0,<6",
  "pypdf>=5.2.0,<6",
]

[project.urls]
Homepage = "https://github.com/VirajSanghvi1/raglite"
Repository = "https://github.com/VirajSanghvi1/raglite"
Issues = "https://github.com/VirajSanghvi1/raglite/issues"

[project.scripts]
raglite = "raglite.raglite_cli:cli"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["raglite*"]
